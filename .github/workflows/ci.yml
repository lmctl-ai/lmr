name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LMCPP_REF: f6c6f51797912a369d6b27cf9e96f148a9a0e4d1
  LMTS_REF: 31012f638613b74114b66bce01c99b8415248263

jobs:
  test:
    name: R 4.3.3 (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout rcli
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: rcli
      - name: Checkout pinned lmcpp
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lmctl-ai/lmcpp
          ref: ${{ env.LMCPP_REF }}
          path: lmcpp
      - name: Checkout pinned lmts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lmctl-ai/lmts
          ref: ${{ env.LMTS_REF }}
          path: lmts
      - name: Install R and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core=4.3.3-2build2 cmake g++ ninja-build nlohmann-json3-dev python3
          Rscript --version 2>&1 | grep -F '4.3.3'
      - name: Build and install lmcpp
        working-directory: lmcpp
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLMCPP_BUILD_TESTS=OFF -DLMCPP_STATIC_STDLIB=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/lmcpp"
          cmake --build build --parallel 2
          cmake --install build
      - name: Build, test and lint rcli
        working-directory: rcli
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/lmcpp" -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          scripts/check-no-libR.sh build/bin/rcli
          build/bin/rcli --schema > cli.schema.dev.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.2
      - name: Parse generated schema with lmts
        working-directory: lmts
        run: |
          bun -e 'import { readFileSync } from "node:fs"; import { parsePublishedSchema } from "./src/publish.ts"; const result = parsePublishedSchema(JSON.parse(readFileSync("../rcli/cli.schema.dev.json", "utf8"))); if (!result.ok) { console.error(result); process.exit(1); } console.log("lmts parsed rcli schema");'
